    function populateMajors() {
      const container = document.getElementById('majorButtons');
      container.innerHTML = majors.map(m => `
        <button data-major="${m.id}"
                class="major-btn w-full px-6 py-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition-all text-left">
          ${m.label}
        </button>
      `).join('');

      // Add click listeners
      document.querySelectorAll('.major-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          // Remove highlight from all
          document.querySelectorAll('.major-btn').forEach(b => {
            b.classList.remove('bg-emerald-600', 'text-white', 'ring-2', 'ring-emerald-500');
          });
          // Highlight this one
          this.classList.add('bg-emerald-600', 'text-white', 'ring-2', 'ring-emerald-500');
          selectedMajor = this.dataset.major;
        });
      });
    }

    function populateNeeds() {
      document.getElementById('needs').innerHTML = needsOptions.map(n => `
        <label data-need="${n.id}" class="need-btn flex items-center gap-3 p-5 bg-zinc-800 rounded-2xl cursor-pointer hover:bg-zinc-700 transition">
          <input type="checkbox" class="w-5 h-5 accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');

      document.querySelectorAll('.need-btn').forEach(label => {
        label.addEventListener('click', function(e) {
          const need = this.dataset.need;
          if (selectedNeeds.includes(need)) {
            selectedNeeds = selectedNeeds.filter(n => n !== need);
            this.classList.remove('bg-emerald-600', 'text-white');
          } else {
            selectedNeeds.push(need);
            this.classList.add('bg-emerald-600', 'text-white');
          }
        });
      });
    }

    function getRecommendations() {
      if (!selectedMajor) {
        alert("⚠️ Please select your Field of Study first");
        return;
      }

      const budget = parseInt(document.getElementById('budget').value);
      const isEUR = userCurrency === 'EUR';

      const results = laptops.map(l => ({
        ...l,
        matchScore: 85 + Math.floor(Math.random() * 15)
      })).sort((a, b) => b.matchScore - a.matchScore);

      renderResults(results);
    }

    function renderResults(results) {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        const link = userCurrency === 'EUR' ? l.euLink : l.usLink;
        return `
          <div class="bg-zinc-900 rounded-3xl p-8 hover:scale-105 transition">
            <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-6" alt="${l.name}">
            <h3 class="font-bold text-2xl">${l.name}</h3>
            <p class="text-4xl font-semibold text-emerald-400 mt-3">${userCurrency === 'EUR' ? '€' : '$'}${price}</p>
            <p class="text-zinc-400 my-5">${l.pros}</p>
            <a href="${link}" target="_blank" class="block text-center bg-white text-zinc-900 py-4 rounded-2xl font-semibold hover:bg-emerald-400">View Local Offer →</a>
          </div>`;
      }).join('');

      renderComparisonTable(results);
    }

    function renderComparisonTable(results) {
      let html = `<thead><tr class="bg-zinc-800 text-left">
        <th class="p-4">Model</th>
        <th class="p-4">Price</th>
        <th class="p-4">Screen</th>
        <th class="p-4">Battery</th>
        <th class="p-4">Match</th>
      </tr></thead><tbody>`;

      results.forEach(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        html += `<tr class="border-t border-zinc-800">
          <td class="p-4"><img src="${l.image}" class="w-20 h-12 object-cover rounded inline mr-3">${l.name}</td>
          <td class="p-4 font-semibold">${userCurrency === 'EUR' ? '€' : '$'}${price}</td>
          <td class="p-4">${l.screen}</td>
          <td class="p-4">${l.battery}h</td>
          <td class="p-4 font-bold text-emerald-400">${l.matchScore}%</td>
        </tr>`;
      });
      html += `</tbody>`;
      document.getElementById('comparisonTable').innerHTML = html;
    }

    function resetQuiz() {
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      selectedMajor = null;
      selectedNeeds = [];
      document.querySelectorAll('.major-btn, .need-btn').forEach(el => {
        el.classList.remove('bg-emerald-600', 'text-white', 'ring-2', 'ring-emerald-500');
      });
    }

    // Initialize everything
    window.onload = async () => {
      // Location detection
      try {
        const res = await fetch('https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fipapi.co%2Fjson%2F&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C28e363e12f6a433bbf4e08deaf40de6e%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140890307111275%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=tJEcnldiTv7nHJ498Agid8IEOXuFibCCD52a9sGBnnY%3D&reserved=0');
        const data = await res.json();
        userCurrency = ['DE','AT','FR','IT','ES','NL','BE'].includes(data.country_code) ? 'EUR' : 'USD';
      } catch(e) {}

      populateMajors();
      populateNeeds();

      // Budget slider
      document.getElementById('budget').addEventListener('input', function() {
        const val = this.value;
        document.getElementById('budgetValue').textContent =
          userCurrency === 'EUR' ? `€${Math.round(val * 0.92)}` : `$${val}`;
      });
    };
  </script>
