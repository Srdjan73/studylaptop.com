<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLaptop.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-white">
  <div class="max-w-4xl mx-auto p-6">

    <h1 class="text-5xl font-bold text-center mt-8">🎓 StudyLaptop.com</h1>
    <p class="text-emerald-400 text-center text-2xl mt-2">Student Laptop Matcher</p>

    <div id="quiz" class="bg-zinc-900 rounded-3xl p-10 mt-12">
      <h2 class="text-3xl text-center mb-10">Tell us about your studies</h2>

      <div class="space-y-10">
        <div>
          <label class="block mb-2">Budget (€)</label>
          <input type="range" id="budget" min="400" max="2500" value="950" class="w-full accent-emerald-500">
          <div class="text-center mt-2" id="budgetValue">€950</div>
        </div>

        <div>
          <label class="block mb-3">Field of Study (tap multiple)</label>
          <div id="majors" class="grid grid-cols-2 md:grid-cols-5 gap-3"></div>
        </div>

        <div>
          <label class="block mb-3">Preferred OS</label>
          <div id="os" class="grid grid-cols-3 gap-3"></div>
        </div>

        <button onclick="getRecommendations()" class="w-full bg-emerald-600 py-6 rounded-3xl text-xl font-semibold">
          Show My Recommendations →
        </button>
      </div>
    </div>

    <div id="results" class="hidden mt-16">
      <h2 class="text-4xl font-bold text-center mb-10">Your Recommendations</h2>
      <div id="recs" class="grid md:grid-cols-2 gap-8"></div>
      <div class="text-center mt-12">
        <button onclick="location.reload()" class="text-emerald-400 text-xl">Start Over</button>
      </div>
    </div>
  </div>

  <script>
    const laptops = [
      {name: "MacBook Air 13 M4", price: 949, image: "https://picsum.photos/id/20/800/500"},
      {name: "Lenovo Yoga Slim 7", price: 849, image: "https://picsum.photos/id/180/800/500"},
      {name: "HP OmniBook 14", price: 699, image: "https://picsum.photos/id/251/800/500"},
      {name: "ASUS Zenbook 14", price: 1049, image: "https://picsum.photos/id/60/800/500"}
    ];

    function populateMajors() {
      const div = document.getElementById('majors');
      div.innerHTML = ["Business","Engineering","Design","Learning","Other"].map(t => `
        <button class="px-6 py-4 bg-zinc-800 rounded-2xl text-sm hover:bg-zinc-700 transition" onclick="this.classList.toggle('bg-emerald-600');this.classList.toggle('text-white')">
          ${t}
        </button>
      `).join('');
    }

    function populateOS() {
      const div = document.getElementById('os');
      div.innerHTML = `
        <button onclick="selectOS(this)" class="os-btn py-4 bg-emerald-600 rounded-2xl">Any</button>
        <button onclick="selectOS(this)" class="os-btn py-4 bg-zinc-800 rounded-2xl">Windows</button>
        <button onclick="selectOS(this)" class="os-btn py-4 bg-zinc-800 rounded-2xl">macOS</button>
      `;
    }

    function selectOS(btn) {
      document.querySelectorAll('.os-btn').forEach(b => b.classList.remove('bg-emerald-600'));
      btn.classList.add('bg-emerald-600');
    }

    function getRecommendations() {
      const budget = parseInt(document.getElementById('budget').value);
      const filtered = laptops.filter(l => l.price <= budget + 300);

      const html = filtered.map(l => `
        <div class="bg-zinc-900 rounded-3xl p-6">
          <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-4">
          <h3 class="font-bold text-xl">${l.name}</h3>
          <p class="text-3xl font-bold text-emerald-400 mt-2">€${l.price}</p>
        </div>
      `).join('');

      document.getElementById('recs').innerHTML = html;
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');
    }

    window.onload = () => {
      populateMajors();
      populateOS();

      document.getElementById('budget').addEventListener('input', function() {
        document.getElementById('budgetValue').textContent = `€${this.value}`;
      });
    };
  </script>
</body>
</html>
