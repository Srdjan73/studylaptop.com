    let selectedMajor = null;
    let selectedNeeds = [];
    let userCurrency = 'USD';
    let userCountry = 'US';

    const needsOptions = [
      {id:"portable", label:"Very lightweight (<1.4kg)"},
      {id:"battery", label:"Long battery life"},
      {id:"power", label:"Powerful processor"},
      {id:"screen", label:"Excellent screen"},
      {id:"touch", label:"Touch / 2-in-1"},
      {id:"keyboard", label:"Specific keyboard layout"},
      {id:"size", label:"Specific screen size"}
    ];

    async function detectLocation() {
      try {
        const res = await fetch('https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fipapi.co%2Fjson%2F&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C0aca41e3bb0f43d0ed1408deaf3cc0aa%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140872720555576%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=YJieh8pajpXiovRsiYv%2FXOXYo%2F%2B6qHXpg2AwR6HlD8Y%3D&reserved=0');
        const data = await res.json();
        userCountry = data.country_code || 'US';
        userCurrency = (userCountry === 'DE' || userCountry === 'FR' || userCountry === 'IT' || userCountry === 'ES' || ['EU','AT','BE','NL'].includes(userCountry)) ? 'EUR' : 'USD';
      } catch(e) {
        console.log("Location detection failed, defaulting to USD");
      }
    }

    function populateNeeds() {
      document.getElementById('needs').innerHTML = needsOptions.map(n => `
        <label onclick="toggleNeed(this)" data-need="${n.id}" class="need-btn flex items-center gap-3 p-5 bg-zinc-800 rounded-2xl cursor-pointer hover:bg-zinc-700">
          <input type="checkbox" class="w-5 h-5 accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');
    }

    function selectMajor(btn) {
      document.querySelectorAll('.major-btn').forEach(b => b.classList.remove('bg-emerald-600','text-white'));
      btn.classList.add('bg-emerald-600','text-white');
      selectedMajor = btn.dataset.major;
    }

    function toggleNeed(el) {
      const need = el.dataset.need;
      if (selectedNeeds.includes(need)) {
        selectedNeeds = selectedNeeds.filter(n => n !== need);
        el.classList.remove('bg-emerald-600','text-white');
      } else {
        selectedNeeds.push(need);
        el.classList.add('bg-emerald-600','text-white');
      }
    }

    function getRecommendations() {
      if (!selectedMajor) return alert("Please select your field");

      const budget = parseInt(document.getElementById('budget').value);
      const isEUR = userCurrency === 'EUR';

      const results = laptops
        .filter(l => (isEUR ? l.priceEUR : l.priceUSD) <= budget + 400)
        .map(l => {
          let score = 85;
          if (selectedMajor === 'engineering' && l.name.includes('Yoga') || l.name.includes('Zenbook')) score += 12;
          if (selectedMajor === 'design' && l.name.includes('Zenbook') || l.name.includes('MacBook')) score += 12;
          if (selectedMajor === 'learning') score += 8;
          return {...l, matchScore: Math.min(99, score)};
        })
        .sort((a,b) => b.matchScore - a.matchScore)
        .slice(0, 6);

      renderResults(results);
    }

    function renderResults(results) {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        const link = userCurrency === 'EUR' ? l.euLink : l.usLink;
        return `
          <div class="bg-zinc-900 rounded-3xl p-8 hover:scale-105 transition">
            <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-6">
            <h3 class="font-bold text-2xl">${l.name}</h3>
            <p class="text-4xl font-semibold text-emerald-400 mt-3">${userCurrency === 'EUR' ? '€' : '$'}${price}</p>
            <p class="text-zinc-400 my-5">${l.pros}</p>
            <a href="${link}" target="_blank" class="block text-center bg-white text-zinc-900 py-4 rounded-2xl font-semibold hover:bg-emerald-400">View Local Offer →</a>
          </div>`;
      }).join('');

      renderComparisonTable(results);
    }

    function renderComparisonTable(results) {
      let html = `<thead><tr class="bg-zinc-800 text-left">
        <th class="p-4">Model</th>
        <th class="p-4">Price</th>
        <th class="p-4">Screen</th>
        <th class="p-4">Battery</th>
        <th class="p-4">Match</th>
      </tr></thead><tbody>`;

      results.forEach(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        html += `
          <tr class="border-t border-zinc-800">
            <td class="p-4">
              <img src="${l.image}" class="w-20 h-12 object-cover rounded inline mr-3">
              ${l.name}
            </td>
            <td class="p-4 font-semibold">${userCurrency === 'EUR' ? '€' : '$'}${price}</td>
            <td class="p-4">${l.screen}</td>
            <td class="p-4">${l.battery}h</td>
            <td class="p-4 font-bold text-emerald-400">${l.matchScore}%</td>
          </tr>`;
      });
      html += `</tbody>`;
      document.getElementById('comparisonTable').innerHTML = html;
    }

    function resetQuiz() {
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      selectedMajor = null; selectedNeeds = [];
      document.querySelectorAll('.major-btn, .need-btn').forEach(el => el.classList.remove('bg-emerald-600','text-white'));
    }

    // Theme toggle + budget live update
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    document.getElementById('budget').addEventListener('input', function() {
      document.getElementById('budgetValue').textContent =
        userCurrency === 'EUR' ? `€${Math.round(this.value * 0.92)}` : `$${this.value}`;
    });

    // Init
    window.onload = async () => {
      await detectLocation();
      populateNeeds();
    };
  </script>
