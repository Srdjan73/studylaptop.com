<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyLaptop.com • Student Laptop Matcher</title>
  <script src="https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdn.tailwindcss.com%2F&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7Cd8ecccadfd504720728708deaff986cc%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639141683427919050%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=33eoQwAJ%2BuwkAyHqCXGrq%2BlwdCZtpFm8pZpWhJUM2X4%3D&reserved=0"></script>
  <link rel="stylesheet" href="https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fcdnjs.cloudflare.com%2Fajax%2Flibs%2Ffont-awesome%2F6.6.0%2Fcss%2Fall.min.css&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7Cd8ecccadfd504720728708deaff986cc%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639141683427980776%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=9mgRB%2Fu6OarzGxzTNBRwXOX%2FhHpkQMOq0DJV5LQmLBw%3D&reserved=0">
</head>
<body class="bg-zinc-950 text-zinc-100 transition-colors">
  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- Header -->
    <header class="text-center py-8 md:py-12 border-b border-zinc-800">
      <h1 class="text-4xl md:text-5xl font-bold mb-3">🎓 StudyLaptop.com</h1>
      <h2 class="text-2xl md:text-3xl font-semibold text-emerald-400 mb-4">Student Laptop Matcher & Budget Optimizer</h2>
      <p class="max-w-2xl mx-auto text-zinc-400 text-base md:text-lg">
        Find the perfect laptop for your major, budget, and campus life in seconds.
      </p>
    </header>

    <!-- Quiz -->
    <div id="quiz" class="max-w-3xl mx-auto mt-10">
      <div class="bg-zinc-900 rounded-3xl p-6 md:p-10">
        <div class="flex justify-end mb-6">
          <button id="themeToggle" class="p-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition">
            <i class="fas fa-moon text-xl"></i>
          </button>
        </div>

        <h2 class="text-2xl md:text-3xl font-semibold mb-8 text-center">Tell us about your studies</h2>

        <div class="space-y-8 md:space-y-10">
          <div>
            <label class="block text-sm mb-3">Your Budget</label>
            <input type="range" id="budget" min="400" max="2500" value="950" step="50" class="w-full accent-emerald-500">
            <div class="flex justify-between text-sm mt-1 text-zinc-400">
              <span>$400 / €370</span>
              <span id="budgetValue" class="font-semibold">$950 / €880</span>
              <span>$2500+ / €2300+</span>
            </div>
          </div>

          <div>
            <label class="block text-sm mb-3">Your Field of Study</label>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="majorButtons"></div>
          </div>

          <div>
            <label class="block text-sm mb-3">Preferred Operating System</label>
            <div class="grid grid-cols-3 gap-3" id="osButtons"></div>
          </div>

          <div>
            <label class="block text-sm mb-3">Must-haves (select all)</label>
            <div class="grid grid-cols-2 gap-3" id="needs"></div>
          </div>

          <button onclick="getRecommendations()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-3xl text-lg md:text-xl font-semibold transition">
            Show My Recommendations →
          </button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="hidden mt-12 md:mt-16">
      <h2 class="text-3xl md:text-4xl font-bold mb-8 text-center">Your Top Recommendations</h2>
      <div id="recommendations" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>

      <div class="text-center mt-10">
        <button onclick="resetQuiz()" class="text-emerald-400 hover:text-emerald-300">← Start Over</button>
      </div>
    </div>
  </div>

  <!-- Laptop Detail Modal -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-auto">
      <div class="p-6">
        <button onclick="closeModal()" class="float-right text-2xl text-zinc-400 hover:text-white">&times;</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <script>
    let selectedMajor = null;
    let selectedOS = "any";
    let selectedNeeds = [];
    let userCurrency = 'USD';
    let userCountry = 'US';

    const majors = [
      {id: "general", label: "General / Business"},
      {id: "engineering", label: "Engineering / CS"},
      {id: "design", label: "Design / Creative"},
      {id: "learning", label: "Learning / Teaching"},
      {id: "other", label: "Other"}
    ];

    const osOptions = [
      {id: "any", label: "Any"},
      {id: "windows", label: "Windows"},
      {id: "macos", label: "macOS"}
    ];

    const needsOptions = [
      {id:"portable", label:"Very lightweight (<1.4kg)"},
      {id:"battery", label:"Long battery life"},
      {id:"power", label:"Powerful processor"},
      {id:"screen", label:"Excellent screen"},
      {id:"touch", label:"Touch / 2-in-1"},
      {id:"keyboard", label:"Specific keyboard layout"},
      {id:"size", label:"Specific screen size"}
    ];

    const laptops = [ /* same 12 laptops as before */ ];

    function getBestLink(laptop) {
      if (userCountry === 'DE' || userCurrency === 'EUR') {
        return laptop.links.mediamarkt || laptop.links.amazonDE;
      } else {
        return laptop.links.bestbuy || laptop.links.amazonUS;
      }
    }

    // Populate functions (fixed OS buttons)
    function populateMajors() { /* same as before */ }
    function populateOS() {
      const container = document.getElementById('osButtons');
      container.innerHTML = osOptions.map(o => `
        <button data-os="${o.id}" class="os-btn px-6 py-4 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition text-center font-medium">
          ${o.label}
        </button>
      `).join('');
      document.querySelectorAll('.os-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.os-btn').forEach(b => b.classList.remove('bg-emerald-600','text-white'));
          this.classList.add('bg-emerald-600','text-white');
          selectedOS = this.dataset.os;
        });
      });
    }

    function populateNeeds() { /* same as before */ }

    function initThemeToggle() { /* same as before */ }

    function getRecommendations() {
      if (!selectedMajor) return alert("Please select your Field of Study");

      const budget = parseInt(document.getElementById('budget').value);
      const isEUR = userCurrency === 'EUR';

      let results = laptops
        .filter(l => (isEUR ? l.priceEUR : l.priceUSD) <= budget + 500)
        .filter(l => selectedOS === "any" || l.os === selectedOS);

      results = results.map(l => {
        let score = 75;
        if (selectedMajor === "engineering" && l.name.includes("ThinkPad")) score += 18;
        if (selectedMajor === "design" && l.name.includes("MacBook")) score += 18;
        if (selectedMajor === "learning" && l.battery > 13) score += 12;
        if (selectedNeeds.includes("portable") && l.weight < 1.4) score += 10;
        if (selectedNeeds.includes("battery") && l.battery > 14) score += 10;
        return {...l, matchScore: Math.min(99, score)};
      }).sort((a,b) => b.matchScore - a.matchScore);

      renderResults(results.slice(0, 6));
    }

    function renderResults(results) {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        return `
          <div class="bg-zinc-900 rounded-3xl p-6 hover:scale-105 transition cursor-pointer" onclick="showLaptopDetail('${l.name}')">
            <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-6" alt="${l.name}">
            <h3 class="font-bold text-xl">${l.name}</h3>
            <p class="text-emerald-400 text-sm">${l.color}</p>
            <p class="text-3xl font-semibold text-emerald-400 mt-2">${userCurrency === 'EUR' ? '€' : '$'}${price}</p>
            <p class="text-zinc-400 my-3 text-sm">${l.pros}</p>
            <button class="w-full bg-white text-zinc-900 py-3 rounded-2xl font-semibold">See All Offers →</button>
          </div>`;
      }).join('');
    }

    function showLaptopDetail(name) {
      const laptop = laptops.find(l => l.name === name);
      if (!laptop) return;

      const price = userCurrency === 'EUR' ? laptop.priceEUR : laptop.priceUSD;
      const currencySymbol = userCurrency === 'EUR' ? '€' : '$';

      const html = `
        <h2 class="text-2xl font-bold mb-6">${laptop.name}</h2>
        <img src="${laptop.image}" class="w-full rounded-2xl mb-6">
        <p class="text-4xl font-semibold mb-6">${currencySymbol}${price} • ${laptop.color}</p>

        <div class="space-y-4">
          <a href="${laptop.links.mediamarkt || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 MediaMarkt (Germany/EU)</a>
          <a href="${laptop.links.amazonDE || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Amazon.de</a>
          <a href="${laptop.links.bestbuy || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Best Buy (US)</a>
          <a href="${laptop.links.amazonUS || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Amazon.com</a>
        </div>

        <button onclick="closeModal()" class="mt-8 w-full py-4 border border-zinc-600 rounded-2xl hover:bg-zinc-800">← Go Back</button>
      `;

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // Rest of the functions (shareOnX, copyLink, printComparison, resetQuiz, etc.) remain the same as previous version
    function shareOnX() { /* same */ }
    function copyLink() { /* same */ }
    function printComparison() { window.print(); }
    function resetQuiz() { /* same */ }
    function updateLastUpdated() { /* same */ }
    async function detectLocation() { /* same */ }

    // Initialize
    window.onload = async () => {
      await detectLocation();
      populateMajors();
      populateOS();
      populateNeeds();
      initThemeToggle();
      updateLastUpdated();

      document.getElementById('budget').addEventListener('input', function() {
        const val = this.value;
        document.getElementById('budgetValue').textContent =
          userCurrency === 'EUR' ? `€${Math.round(val * 0.92)}` : `$${val}`;
      });
    };
  </script>
</body>
</html>
