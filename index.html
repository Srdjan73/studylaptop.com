          <div>
            <label class="block text-sm mb-3">Budget (USD)</label>
            <input type="range" id="budget" min="400" max="2200" value="950" step="50"

            <div class="flex justify-between text-sm mt-1 text-zinc-400">
              <span>$400</span>
              <span id="budgetValue" class="font-semibold">$950</span>
              <span>$2200+</span>

          </div>

          <!-- Major -->
          <div>
            <label class="block text-sm mb-3">Your Major / Field</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <button onclick="selectMajor(this)" data-major="general" class="major-btn px-6 py-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition text-left">General / Business</button>
              <button onclick="selectMajor(this)" data-major="engineering" class="major-btn px-6 py-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition text-left">Engineering / CS</button>

      <!-- Comparison Table -->

        <div class="overflow-x-auto">

      {id:3, name:"HP OmniBook 5 14", price:749, weight:1.35, battery:13, score:91, bestFor:"general,engineering", pros:"Great value & ports", link:"https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Famazon.com%2Fs%3Fk%3Dhp%2Bomnibook%2B5%26tag%3DYOURTAG&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965605979%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=jVf1ZnM%2Bcmm0LjkoUyHSyZo9pzAy8wY8l3iN9XOujM0%3D&reserved=0"},
      {id:4, name:"ASUS Zenbook 14 OLED", price:1099, weight:1.2, battery:15, score:94, bestFor:"design,engineering", pros:"Stunning OLED screen", link:"https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Famazon.com%2Fs%3Fk%3Dasus%2Bzenbook%2B14%26tag%3DYOURTAG&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965693082%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=wvdPo40ZbHueGLoXw%2Bln9akzhnpPe6IqTZS8uqmgLG8%3D&reserved=0"},
      {id:5, name:"Dell XPS 13", price:1199, weight:1.17, battery:12, score:90, bestFor:"general", pros:"Premium feel", link:"https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Famazon.com%2Fs%3Fk%3Ddell%2Bxps%2B13%26tag%3DYOURTAG&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965757247%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=9NSKkvmYQM38PeY9nIT5TiEgPbhb3jthTS0%2FkKIQj28%3D&reserved=0"},
      {id:6, name:"Acer Swift Go 14", price:649, weight:1.3, battery:11, score:87, bestFor:"general,engineering", pros:"Best under $700", link:"https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Famazon.com%2Fs%3Fk%3Dacer%2Bswift%2Bgo%26tag%3DYOURTAG&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965816739%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=C4NAoSyYzW%2FoLAsJ9iqX7QGtVo6KIgS%2FVOUWt3nd06Q%3D&reserved=0"},
      {id:7, name:"Microsoft Surface Laptop 7", price:999, weight:1.34, battery:14, score:89, bestFor:"general", pros:"Beautiful design", link:"https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Famazon.com%2Fs%3Fk%3Dsurface%2Blaptop%2B7%26tag%3DYOURTAG&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965870201%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=URfWkui5dhFGrWVPzIvn3%2BIUYS9tsiIz1G3cyoiXgxU%3D&reserved=0"}
    ];

    let selectedMajor = null;
    let selectedNeeds = [];

    const needsOptions = [
      {id:"portable", label:"Very lightweight (<1.4kg)"},
      {id:"battery", label:"Long battery life"},
      {id:"power", label:"Powerful (coding / editing)"},
      {id:"screen", label:"Excellent screen"},
      {id:"touch", label:"Touch / 2-in-1"}
    ];

    function populateNeeds() {
      document.getElementById('needs').innerHTML = needsOptions.map(n => `
        <label onclick="toggleNeed(this)" data-need="${n.id}" class="need-btn flex items-center gap-3 p-5 bg-zinc-800 rounded-2xl cursor-pointer hover:bg-zinc-700 transition">
          <input type="checkbox" class="w-5 h-5 accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');
    }

    function selectMajor(btn) {
      document.querySelectorAll('.major-btn').forEach(b => b.classList.remove('bg-emerald-600','text-white'));
      btn.classList.add('bg-emerald-600','text-white');
      selectedMajor = btn.dataset.major;
    }

    function toggleNeed(el) {
      const need = el.dataset.need;
      if (selectedNeeds.includes(need)) {
        selectedNeeds = selectedNeeds.filter(n => n !== need);
        el.classList.remove('bg-emerald-600','text-white');
      } else {
        selectedNeeds.push(need);
        el.classList.add('bg-emerald-600','text-white');
      }
    }

    function getRecommendations() {
      const budget = parseInt(document.getElementById('budget').value);
      if (!selectedMajor) return alert("Please select your major");

      const results = laptops
        .filter(l => l.price <= budget + 400)
        .map(l => {
          let score = l.score;
          if (selectedMajor === 'engineering' && l.bestFor.includes('engineering')) score += 12;
          if (selectedMajor === 'design' && l.bestFor.includes('design')) score += 12;
          if (selectedNeeds.includes('portable') && l.weight < 1.35) score += 8;
          if (selectedNeeds.includes('battery') && l.battery > 13) score += 8;
          return {...l, matchScore: Math.min(99, score)};
        })
        .sort((a,b) => b.matchScore - a.matchScore)
        .slice(0, 6);

      renderResults(results, budget);
    }

    function renderResults(results, budget) {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => `
        <div class="bg-zinc-900 rounded-3xl p-8 card-hover transition">
          <div class="text-6xl mb-4">💻</div>
          <h3 class="font-bold text-2xl">${l.name}</h3>
          <p class="text-4xl font-semibold text-emerald-400 mt-3">$${l.price}</p>
          <p class="text-zinc-400 my-5">${l.pros}</p>
          <a href="${l.link}" target="_blank" class="block text-center bg-white text-zinc-900 py-4 rounded-2xl font-semibold hover:bg-emerald-400 transition">
            View Deal →
          </a>
          <p class="text-center text-xs text-emerald-400 mt-6">${l.matchScore}% match</p>
        </div>
      `).join('');

      renderComparisonTable(results);
      renderShareButtons(results);
    }

    function renderComparisonTable(results) {
      let html = `
        <thead><tr class="bg-zinc-800">
          <th class="p-4 text-left">Model</th>
          <th class="p-4">Price</th>
          <th class="p-4">Weight</th>
          <th class="p-4">Battery</th>
          <th class="p-4">Match</th>
        </tr></thead><tbody>`;

      results.forEach(l => {
        html += `
          <tr class="border-t border-zinc-800">
            <td class="p-4 font-medium">${l.name}</td>
            <td class="p-4 text-center">$${l.price}</td>
            <td class="p-4 text-center">${l.weight} kg</td>
            <td class="p-4 text-center">${l.battery}h</td>
            <td class="p-4 text-center font-bold text-emerald-400">${l.matchScore}%</td>
          </tr>`;
      });
      html += `</tbody>`;
      document.getElementById('comparisonTable').innerHTML = html;
    }

    function renderShareButtons(results) {
      const text = `I found my perfect student laptop using StudentLaptop.fit!`;
      const url = window.location.href;

      document.getElementById('shareButtons').innerHTML = `
        <a href="https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Ftwitter.com%2Fintent%2Ftweet%3Ftext%3D%24&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965915071%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=%2FLAK2N6CaLZP4xvehf4sWe8aHAgdfTWB3o92Tb8Xn%2Fw%3D&reserved=0{encodeURIComponent(text)}&url=${encodeURIComponent(url)}" target="_blank" class="px-6 py-3 bg-black rounded-2xl hover:bg-zinc-800">𝕏</a>
        <a href="https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fwww.facebook.com%2Fsharer%2Fsharer.php%3Fu%3D%24&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C2f63fb7a1f0243c9052408deaf32d1fe%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140829965967481%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=rrXKdXP6MOofFcUCIm26SB0PSVXfIDXl56%2Fj5YylGFQ%3D&reserved=0{encodeURIComponent(url)}" target="_blank" class="px-6 py-3 bg-blue-600 rounded-2xl hover:bg-blue-700">f</a>
        <button onclick="copyLink()" class="px-6 py-3 bg-zinc-800 rounded-2xl hover:bg-zinc-700">📋 Copy Link</button>
      `;
    }

    function copyLink() {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied! Share it with friends.");
    }

    function resetQuiz() {
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      selectedMajor = null;
      selectedNeeds = [];
      document.querySelectorAll('.major-btn, .need-btn').forEach(el => el.classList.remove('bg-emerald-600','text-white'));
    }

    // Theme Toggle
    const toggle = document.getElementById('themeToggle');
    toggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      toggle.innerHTML = document.documentElement.classList.contains('dark') ?
        '<i class="fas fa-sun text-xl"></i>' : '<i class="fas fa-moon text-xl"></i>';
    });

    // Budget live update
    document.getElementById('budget').addEventListener('input', function() {
      document.getElementById('budgetValue').textContent = '$' + this.value;
    });

    window.onload = () => {
      populateNeeds();
    };
  </script>
</body>
</html>
