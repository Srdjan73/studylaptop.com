    let selectedMajor = null;
    let selectedNeeds = [];
    let userCurrency = 'USD';
    let userCountry = 'US';

    const majors = [
      {id: "general", label: "General / Business"},
      {id: "engineering", label: "Engineering / CS"},
      {id: "design", label: "Design / Creative"},
      {id: "learning", label: "Learning / Teaching"},
      {id: "other", label: "Other"}
    ];

    const needsOptions = [
      {id:"portable", label:"Very lightweight (<1.4kg)"},
      {id:"battery", label:"Long battery life"},
      {id:"power", label:"Powerful processor"},
      {id:"screen", label:"Excellent screen"},
      {id:"touch", label:"Touch / 2-in-1"},
      {id:"keyboard", label:"Specific keyboard layout"},
      {id:"size", label:"Specific screen size"}
    ];

    async function detectLocation() { /* same as before */
      try {
        const res = await fetch('https://eur01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fipapi.co%2Fjson%2F&data=05%7C02%7Csrdjan.antonijevic%40lis.school%7C8aabd2d59ea54723fe8208deaf3e76cf%7C81557573fa0c44899e98572ebd403ed1%7C0%7C0%7C639140879993876557%7CUnknown%7CTWFpbGZsb3d8eyJFbXB0eU1hcGkiOnRydWUsIlYiOiIwLjAuMDAwMCIsIlAiOiJXaW4zMiIsIkFOIjoiTWFpbCIsIldUIjoyfQ%3D%3D%7C0%7C%7C%7C&sdata=C%2BZaiytRGGcpCnkzvmvqm7iJyQ4qwsZAIB0AULJYqoY%3D&reserved=0');
        const data = await res.json();
        userCountry = data.country_code || 'US';
        userCurrency = ['DE','AT','FR','IT','ES','NL','BE'].includes(userCountry) ? 'EUR' : 'USD';
      } catch(e) {}
    }

    function populateMajors() {
      const container = document.getElementById('majorButtons');
      container.innerHTML = majors.map(m => `
        <button onclick="selectMajor(this)" data-major="${m.id}"
                class="major-btn px-5 py-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition text-left">
          ${m.label}
        </button>
      `).join('');
    }

    function selectMajor(btn) {
      document.querySelectorAll('.major-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white');
      });
      btn.classList.add('bg-emerald-600', 'text-white');
      selectedMajor = btn.dataset.major;
    }

    function populateNeeds() {
      document.getElementById('needs').innerHTML = needsOptions.map(n => `
        <label onclick="toggleNeed(this)" data-need="${n.id}"
               class="need-btn flex items-center gap-3 p-5 bg-zinc-800 rounded-2xl cursor-pointer hover:bg-zinc-700 transition">
          <input type="checkbox" class="w-5 h-5 accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');
    }

    function toggleNeed(el) {
      const need = el.dataset.need;
      if (selectedNeeds.includes(need)) {
        selectedNeeds = selectedNeeds.filter(n => n !== need);
        el.classList.remove('bg-emerald-600','text-white');
      } else {
        selectedNeeds.push(need);
        el.classList.add('bg-emerald-600','text-white');
      }
    }

    function getRecommendations() {
      if (!selectedMajor) {
        alert("Please select your field of study");
        return;
      }
      // ... rest of the function (same as previous version)
      const budget = parseInt(document.getElementById('budget').value);
      const isEUR = userCurrency === 'EUR';

      const results = laptops
        .filter(l => (isEUR ? l.priceEUR : l.priceUSD) <= budget + 400)
        .map(l => ({...l, matchScore: 88}))
        .sort((a,b) => b.matchScore - a.matchScore);

      renderResults(results);
    }

    function renderResults(results) { /* same as previous version */
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        const link = userCurrency === 'EUR' ? l.euLink : l.usLink;
        return `
          <div class="bg-zinc-900 rounded-3xl p-8 hover:scale-105 transition">
            <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-6" alt="${l.name}">
            <h3 class="font-bold text-2xl">${l.name}</h3>
            <p class="text-4xl font-semibold text-emerald-400 mt-3">${userCurrency === 'EUR' ? '€' : '$'}${price}</p>
            <p class="text-zinc-400 my-5">${l.pros}</p>
            <a href="${link}" target="_blank" class="block text-center bg-white text-zinc-900 py-4 rounded-2xl font-semibold hover:bg-emerald-400 transition">View Local Offer →</a>
          </div>`;
      }).join('');

      renderComparisonTable(results);
    }

    function renderComparisonTable(results) { /* same as previous */
      let html = `<thead><tr class="bg-zinc-800"><th class="p-4">Model</th><th class="p-4">Price</th><th class="p-4">Screen</th><th class="p-4">Battery</th><th class="p-4">Match</th></tr></thead><tbody>`;
      results.forEach(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        html += `<tr class="border-t border-zinc-800">
          <td class="p-4"><img src="${l.image}" class="w-20 h-12 object-cover rounded inline mr-3">${l.name}</td>
          <td class="p-4 font-semibold">${userCurrency === 'EUR' ? '€' : '$'}${price}</td>
          <td class="p-4">${l.screen}</td>
          <td class="p-4">${l.battery}h</td>
          <td class="p-4 font-bold text-emerald-400">${l.matchScore}%</td>
        </tr>`;
      });
      html += `</tbody>`;
      document.getElementById('comparisonTable').innerHTML = html;
    }

    function resetQuiz() {
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      selectedMajor = null;
      selectedNeeds = [];
      document.querySelectorAll('.major-btn, .need-btn').forEach(el => el.classList.remove('bg-emerald-600','text-white'));
    }

    // Init
    window.onload = async () => {
      await detectLocation();
      populateMajors();
      populateNeeds();

      // Budget live update
      document.getElementById('budget').addEventListener('input', function() {
        const val = this.value;
        document.getElementById('budgetValue').textContent =
          userCurrency === 'EUR' ? `€${Math.round(val * 0.92)}` : `$${val}`;
      });
    };
  </script>
