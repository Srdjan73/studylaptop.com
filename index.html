    // (All other functions are the same as the last working version)

    function initThemeToggle() {
      const toggle = document.getElementById('themeToggle');
      const icon = toggle.querySelector('i');
      toggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        if (document.documentElement.classList.contains('dark')) {
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        } else {
          icon.classList.remove('fa-sun');
          icon.classList.add('fa-moon');
        }
      });
    }

    // Rest of the script (populate functions, getRecommendations, renderResults, modal, share, etc.) is identical to the previous full version.

    window.onload = async () => {
      await detectLocation();
      populateMajors();
      populateOS();
      populateNeeds();
      initThemeToggle();
      updateLastUpdated();

      document.getElementById('budget').addEventListener('input', function() {
        const val = this.value;
        document.getElementById('budgetValue').textContent =
          userCurrency === 'EUR' ? `€${Math.round(val * 0.92)}` : `$${val}`;
      });
    };
