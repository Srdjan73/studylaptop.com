<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find the best laptop for your major, budget and campus life.">
  <title>StudyLaptop.com • Best Student Laptops 2026</title>
 
  <!-- CookieYes -->
  <script id="cookieyes" type="text/javascript" src="https://cdn-cookieyes.com/client_data/eba4867a8579717b8651f8e0/script.js"></script>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-45S49P87JJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-45S49P87JJ');
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-100">
  <div class="max-w-7xl mx-auto p-4 md:p-6">

    <!-- Header -->
    <header class="text-center py-8 md:py-12 border-b border-zinc-800">
      <h1 class="text-4xl md:text-5xl font-bold mb-3">🎓 StudyLaptop.com</h1>
      <h2 class="text-2xl md:text-3xl font-semibold text-emerald-400 mb-4">Student Laptop Matcher & Budget Optimizer</h2>
      <p class="max-w-2xl mx-auto text-zinc-400">Find the perfect laptop for your major, budget, and campus life in seconds.</p>
    </header>

    <!-- Quiz -->
    <div id="quiz" class="max-w-3xl mx-auto mt-10">
      <div class="bg-zinc-900 rounded-3xl p-6 md:p-10">
        <div class="flex justify-end mb-6">
          <button id="themeToggle" class="p-3 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition">
            <i class="fas fa-moon text-xl"></i>
          </button>
        </div>

        <h2 class="text-2xl md:text-3xl font-semibold mb-8 text-center">Tell us about your studies</h2>
       
        <div class="space-y-8">
          <!-- Budget -->
          <div>
            <label class="block text-sm mb-3">Your Budget</label>
            <input type="range" id="budget" min="400" max="2500" value="950" step="50" class="w-full accent-emerald-500">
            <div class="flex justify-between text-sm mt-1 text-zinc-400">
              <span>€400</span>
              <span id="budgetValue" class="font-semibold">€950</span>
              <span>€2500+</span>
            </div>
          </div>

          <!-- Field of Study -->
          <div>
            <label class="block text-sm mb-3">Your Field of Study <span class="text-emerald-400">(multiple possible)</span></label>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="majorButtons"></div>
          </div>

          <!-- OS -->
          <div>
            <label class="block text-sm mb-3">Preferred Operating System</label>
            <div class="grid grid-cols-3 gap-3" id="osButtons"></div>
          </div>

          <!-- Must-haves -->
          <div>
            <label class="block text-sm mb-3">Must-haves (select all)</label>
            <div class="grid grid-cols-2 gap-3" id="needs"></div>
          </div>

          <button onclick="getRecommendations()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-6 rounded-3xl text-lg font-semibold transition">
            Show My Recommendations →
          </button>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="hidden mt-12">
      <h2 class="text-3xl font-bold mb-8 text-center">Your Top Recommendations</h2>
      <div id="recommendations" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
      <div class="text-center mt-10">
        <button onclick="resetQuiz()" class="text-emerald-400">← Start Over</button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="mt-20 text-center text-zinc-500 text-sm">
      <p>© <span id="year"></span> StudyLaptop.com</p>
    </footer>
  </div>

  <!-- Modal -->
  <div id="detailModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 rounded-3xl max-w-xl w-full max-h-[90vh] overflow-auto">
      <div class="p-6">
        <button onclick="closeModal()" class="float-right text-3xl">×</button>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <script>
    let selectedMajor = [];
    let selectedOS = "any";
    let selectedNeeds = [];

    const majors = [
      {id: "general", label: "General / Business"},
      {id: "engineering", label: "Engineering / CS"},
      {id: "design", label: "Design / Creative"},
      {id: "learning", label: "Learning / Teaching"},
      {id: "other", label: "Other"}
    ];

    const osOptions = [
      {id: "any", label: "Any"},
      {id: "windows", label: "Windows"},
      {id: "macos", label: "macOS"}
    ];

    const needsOptions = [
      {id:"portable", label:"Very lightweight"},
      {id:"battery", label:"Long battery life"},
      {id:"power", label:"Powerful processor"},
      {id:"screen", label:"Specific screen size"},
      {id:"touch", label:"Touch / 2-in-1"}
    ];

    const laptops = [
      {name: "Apple MacBook Air 13 M4", os:"macos", price:949, image:"https://picsum.photos/id/20/800/600", pros:"Best battery"},
      {name: "Lenovo Yoga Slim 7i", os:"windows", price:849, image:"https://picsum.photos/id/180/800/600", pros:"Great 2-in-1"},
      {name: "HP OmniBook 5", os:"windows", price:699, image:"https://picsum.photos/id/251/800/600", pros:"Best value"},
      {name: "ASUS Zenbook 14", os:"windows", price:1049, image:"https://picsum.photos/id/60/800/600", pros:"Beautiful screen"}
    ];

    function populateMajors() {
      const div = document.getElementById('majorButtons');
      div.innerHTML = majors.map(m => `
        <button data-id="${m.id}" class="major-btn px-4 py-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700 text-sm">${m.label}</button>
      `).join('');
      div.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          if (selectedMajor.includes(id)) {
            selectedMajor = selectedMajor.filter(x => x !== id);
            btn.classList.remove('bg-emerald-600', 'text-white');
          } else {
            selectedMajor.push(id);
            btn.classList.add('bg-emerald-600', 'text-white');
          }
        });
      });
    }

    function populateOS() {
      const div = document.getElementById('osButtons');
      div.innerHTML = osOptions.map(o => `
        <button data-id="${o.id}" class="os-btn px-6 py-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">${o.label}</button>
      `).join('');
      div.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.os-btn').forEach(b => b.classList.remove('bg-emerald-600', 'text-white'));
          btn.classList.add('bg-emerald-600', 'text-white');
          selectedOS = btn.dataset.id;
        });
      });
    }

    function populateNeeds() {
      const div = document.getElementById('needs');
      div.innerHTML = needsOptions.map(n => `
        <label data-id="${n.id}" class="need-btn flex items-center gap-3 p-4 bg-zinc-800 rounded-2xl cursor-pointer">
          <input type="checkbox" class="accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');
      div.querySelectorAll('label').forEach(label => {
        label.addEventListener('click', () => {
          const id = label.dataset.id;
          if (selectedNeeds.includes(id)) {
            selectedNeeds = selectedNeeds.filter(x => x !== id);
            label.classList.remove('bg-emerald-600', 'text-white');
          } else {
            selectedNeeds.push(id);
            label.classList.add('bg-emerald-600', 'text-white');
          }
        });
      });
    }

    function getRecommendations() {
      if (selectedMajor.length === 0) return alert("Please select at least one field of study");

      let results = laptops.filter(l => l.price <= parseInt(document.getElementById('budget').value) + 300);

      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => `
        <div onclick="showLaptopDetail('${l.name}')" class="bg-zinc-900 rounded-3xl p-6 cursor-pointer hover:scale-105 transition">
          <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-4">
          <h3 class="font-bold">${l.name}</h3>
          <p class="text-emerald-400 text-3xl font-bold">€${l.price}</p>
          <p class="text-zinc-400 text-sm">${l.pros}</p>
        </div>
      `).join('');
    }

    function showLaptopDetail(name) {
      const laptop = laptops.find(l => l.name === name);
      document.getElementById('modalContent').innerHTML = `
        <h2 class="text-2xl font-bold mb-4">${laptop.name}</h2>
        <img src="${laptop.image}" class="w-full rounded-2xl mb-6">
        <p class="text-4xl font-bold text-emerald-400">€${laptop.price}</p>
        <a href="https://amazon.de/s?k=${laptop.name}&tag=studylaptop20-20" target="_blank" class="block mt-6 bg-emerald-600 py-4 rounded-2xl text-center font-semibold">Buy on Amazon.de</a>
      `;
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function resetQuiz() {
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('results').classList.add('hidden');
      selectedMajor = []; selectedNeeds = [];
    }

    // Init
    window.onload = () => {
      populateMajors();
      populateOS();
      populateNeeds();

      document.getElementById('budget').addEventListener('input', function() {
        document.getElementById('budgetValue').textContent = `€${this.value}`;
      });

      document.getElementById('year').textContent = new Date().getFullYear();
    };
  </script>
</body>
</html>
