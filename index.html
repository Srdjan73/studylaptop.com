    function getBestLink(laptop) {
      if (userCountry === 'DE' || userCurrency === 'EUR') {
        return laptop.links.mediamarkt || laptop.links.amazonDE;
      } else {
        return laptop.links.bestbuy || laptop.links.amazonUS;
      }
    }

    function populateMajors() {
      const container = document.getElementById('majorButtons');
      container.innerHTML = majors.map(m => `
        <button data-major="${m.id}" class="major-btn w-full px-6 py-5 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition-all text-left text-sm md:text-base">
          ${m.label}
        </button>
      `).join('');
      document.querySelectorAll('.major-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.major-btn').forEach(b => b.classList.remove('bg-emerald-600','text-white','ring-2','ring-emerald-500'));
          this.classList.add('bg-emerald-600','text-white','ring-2','ring-emerald-500');
          selectedMajor = this.dataset.major;
        });
      });
    }

    function populateOS() {
      const container = document.getElementById('osButtons');
      container.innerHTML = osOptions.map(o => `
        <button data-os="${o.id}" class="os-btn px-6 py-4 rounded-2xl bg-zinc-800 hover:bg-zinc-700 transition text-center font-medium">
          ${o.label}
        </button>
      `).join('');
      document.querySelectorAll('.os-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.os-btn').forEach(b => b.classList.remove('bg-emerald-600','text-white'));
          this.classList.add('bg-emerald-600','text-white');
          selectedOS = this.dataset.os;
        });
      });
    }

    function populateNeeds() {
      document.getElementById('needs').innerHTML = needsOptions.map(n => `
        <label data-need="${n.id}" class="need-btn flex items-center gap-3 p-5 bg-zinc-800 rounded-2xl cursor-pointer hover:bg-zinc-700 transition text-sm">
          <input type="checkbox" class="w-5 h-5 accent-emerald-500">
          <span>${n.label}</span>
        </label>
      `).join('');
      document.querySelectorAll('.need-btn').forEach(label => {
        label.addEventListener('click', function() {
          const need = this.dataset.need;
          if (selectedNeeds.includes(need)) {
            selectedNeeds = selectedNeeds.filter(n => n !== need);
            this.classList.remove('bg-emerald-600','text-white');
          } else {
            selectedNeeds.push(need);
            this.classList.add('bg-emerald-600','text-white');
          }
        });
      });
    }

    function initThemeToggle() {
      const toggle = document.getElementById('themeToggle');
      const icon = toggle.querySelector('i');
      toggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        if (document.documentElement.classList.contains('dark')) {
          icon.classList.remove('fa-moon'); icon.classList.add('fa-sun');
        } else {
          icon.classList.remove('fa-sun'); icon.classList.add('fa-moon');
        }
      });
    }

    function getRecommendations() {
      if (!selectedMajor) return alert("⚠️ Please select your Field of Study first");

      const budget = parseInt(document.getElementById('budget').value);
      const isEUR = userCurrency === 'EUR';

      let results = laptops
        .filter(l => (isEUR ? l.priceEUR : l.priceUSD) <= budget + 500)
        .filter(l => selectedOS === "any" || l.os === selectedOS);

      results = results.map(l => {
        let score = 75;
        if (selectedMajor === "engineering" && l.name.includes("ThinkPad")) score += 18;
        if (selectedMajor === "design" && l.name.includes("MacBook")) score += 18;
        if (selectedMajor === "learning" && l.battery > 13) score += 12;
        if (selectedNeeds.includes("portable") && l.weight < 1.4) score += 10;
        if (selectedNeeds.includes("battery") && l.battery > 14) score += 10;
        return {...l, matchScore: Math.min(99, score)};
      }).sort((a,b) => b.matchScore - a.matchScore);

      renderResults(results.slice(0, 6));
    }

    function renderResults(results) {
      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('results').classList.remove('hidden');

      const container = document.getElementById('recommendations');
      container.innerHTML = results.map(l => {
        const price = userCurrency === 'EUR' ? l.priceEUR : l.priceUSD;
        return `
          <div onclick="showLaptopDetail('${l.name}')" class="bg-zinc-900 rounded-3xl p-6 hover:scale-105 transition cursor-pointer">
            <img src="${l.image}" class="w-full h-48 object-cover rounded-2xl mb-6" alt="${l.name}">
            <h3 class="font-bold text-xl">${l.name}</h3>
            <p class="text-emerald-400 text-sm">${l.color}</p>
            <p class="text-3xl font-semibold text-emerald-400 mt-2">${userCurrency === 'EUR' ? '€' : '$'}${price}</p>
            <p class="text-zinc-400 my-4 text-sm">${l.pros}</p>
            <button class="w-full bg-white text-zinc-900 py-3 rounded-2xl font-semibold">See All Offers →</button>
          </div>`;
      }).join('');
    }

    function showLaptopDetail(name) {
      const laptop = laptops.find(l => l.name === name);
      if (!laptop) return;

      const price = userCurrency === 'EUR' ? laptop.priceEUR : laptop.priceUSD;
      const symbol = userCurrency === 'EUR' ? '€' : '$';

      const html = `
        <h2 class="text-2xl font-bold mb-6">${laptop.name}</h2>
        <img src="${laptop.image}" class="w-full rounded-2xl mb-6">
        <p class="text-4xl font-semibold mb-6">${symbol}${price} • ${laptop.color}</p>

        <div class="space-y-4 mb-8">
          <a href="${laptop.links.mediamarkt || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 MediaMarkt (Germany / EU)</a>
          <a href="${laptop.links.amazonDE || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Amazon.de</a>
          <a href="${laptop.links.bestbuy || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Best Buy (US)</a>
          <a href="${laptop.links.amazonUS || '#'}" target="_blank" class="block p-4 bg-zinc-800 rounded-2xl hover:bg-zinc-700">🛒 Amazon.com</a>
        </div>

        <button onclick="closeModal()" class="w-full py-4 border border-zinc-600 rounded-2xl hover:bg-zinc-800 text-lg">← Go Back</button>
      `;

      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('detailModal').classList.remove('hidden');
    }
